<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineBusca - Filmes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <header class="bg-dark text-white">
    <nav class="navbar navbar-expand-md navbar-dark px-3">
      <a class="navbar-brand fw-bold" href="#">CineBusca</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" href="#" id="nav-popular">Populares</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" id="nav-favorites">Favoritos</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="container py-4 flex-grow-1">

    <section class="mb-4" aria-labelledby="titulo-busca">
      <h1 class="h3" id="titulo-busca">Encontre filmes</h1>
      <form id="search-form" class="row g-2 align-items-start" novalidate>
        <div class="col-12 col-md-6">
          <label for="search-input" class="visually-hidden">Buscar filme pelo título</label>
          <input id="search-input" class="form-control" type="search" placeholder="Ex.: Matrix, Interestelar..." maxlength="80" autocomplete="off">
          <div class="invalid-feedback">Digite pelo menos 2 caracteres.</div>
        </div>
        <div class="col-8 col-md-3">
          <label for="genre-select" class="visually-hidden">Filtrar por gênero</label>
          <select id="genre-select" class="form-select">
            <option value="">Todos os gêneros</option>
          </select>
          <small id="genre-help" class="form-text text-danger d-none">Não foi possível carregar os gêneros.</small>
        </div>
        <div class="col-4 col-md-3 d-grid">
          <button id="search-btn" class="btn btn-primary" type="submit">Buscar</button>
        </div>
      </form>
    </section>

    <section aria-live="polite">
      <div id="feedback" class="alert d-none" role="alert">
        <span id="feedback-text"></span>
        <button id="retry-btn" class="btn btn-sm btn-outline-danger d-none" type="button">Tentar novamente</button>
      </div>
      <div id="loading" class="text-center py-4 d-none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Carregando...</span>
        </div>
      </div>
    </section>

    <section aria-label="Lista de filmes">
      <div id="movie-grid" class="row g-3"></div>
    </section>

  </main>

  <footer class="bg-dark text-white-50 text-center py-3 mt-auto">
    <small>
      Dados fornecidos pela <a href="https://www.themoviedb.org/" target="_blank" rel="noopener" class="text-white">API do TMDB</a>.
      Este produto não é endossado nem certificado pelo TMDB.
    </small>
  </footer>

  <div class="modal fade" id="movie-modal" tabindex="-1" aria-labelledby="modal-title" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="modal-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer">
          <button id="fav-btn" type="button" class="btn btn-outline-warning" disabled>Adicionar aos favoritos</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
